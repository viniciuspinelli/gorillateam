<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - GymDiet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #111113;
      --bg-secondary: #1C1C1F;
      --bg-tertiary: #27272B;
      --accent-primary: #F97316;
      --accent-hover: #EA6A0A;
      --accent-glow: rgba(249, 115, 22, 0.25);
      --text-primary: #EFEFEF;
      --text-secondary: #A1A1AA;
      --text-tertiary: #71717A;
      --border-default: #2E2E33;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --status-success: #22C55E;
      --status-success-bg: rgba(34, 197, 94, 0.10);
      --status-error: #EF4444;
      --status-error-bg: rgba(239, 68, 68, 0.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 100%;
      padding: 40px 36px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .logo p {
      color: var(--text-tertiary);
      font-size: 13.5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 13px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 13px;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--text-tertiary);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14.5px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-bottom: 18px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      display: none;
    }

    .message.sucesso {
      background: var(--status-success-bg);
      color: var(--status-success);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: block;
    }

    .message.erro {
      background: var(--status-error-bg);
      color: var(--status-error);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: block;
    }

    .info-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--accent-glow);
      background: rgba(249, 115, 22, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.2);
      padding: 14px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .info-box svg {
      flex-shrink: 0;
      margin-top: 1px;
      stroke: var(--accent-primary);
    }

    .info-box strong {
      color: var(--text-primary);
    }

    .already-configured {
      text-align: center;
      color: var(--text-secondary);
    }

    .already-configured h2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .already-configured h2 svg {
      stroke: var(--status-success);
    }

    .already-configured p {
      margin-bottom: 20px;
      color: var(--text-tertiary);
      font-size: 13.5px;
    }

    .already-configured a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
      transition: transform 140ms ease;
    }

    .already-configured a:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      <h1>GymDiet</h1>
      <p>Seu gerenciador pessoal de fitness e dieta</p>
    </div>

    <div id="formSetup">
      <div class="info-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span><strong>Bem-vindo!</strong><br>Esta é a primeira inicialização. Crie suas credenciais de administrador para começar.</span>
      </div>

      <div id="mensagem" class="message"></div>

      <form id="setupForm">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="escolha um nome de usuário"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="mínimo 6 caracteres"
            required
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="confirme sua senha"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="btnSubmit">Criar Admin</button>
      </form>
    </div>

    <div id="jaConfigurado" class="already-configured" style="display: none;">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Já Configurado
      </h2>
      <p>O administrador já foi criado anteriormente.</p>
      <a href="/auth/login">
        Ir para Login
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </div>

  <script src="/js/setup.js"></script>
</body>
</html>
